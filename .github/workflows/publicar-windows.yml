name: Publicar Windows Native v1.9.0

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-native:
    runs-on: windows-latest

    steps:
      - name: Baixar código v1.9.0 READY
        uses: actions/checkout@v4

      - name: Preparar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Instalar Inno Setup
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao instalar o Inno Setup.' }

