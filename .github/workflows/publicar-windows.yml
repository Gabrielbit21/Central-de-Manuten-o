name: Validar e publicar Windows Native

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão sem prefixo v. Se vazio, usa version.json.'
        required: false
        type: string
  pull_request:
    paths:
      - '.github/workflows/publicar-windows.yml'
      - 'global.json'
      - 'windows/**'
      - 'index.html'
      - 'app.js'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'version.json'
      - 'assets/**'
      - 'vendor/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publicar-windows.yml'
      - 'global.json'
      - 'windows/**'
      - 'index.html'
      - 'app.js'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'version.json'
      - 'assets/**'
      - 'vendor/**'

concurrency:
  group: windows-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-windows-native:
    name: Compilar e testar instalador
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      app_version: ${{ steps.metadata.outputs.app_version }}
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}

    steps:
      - name: Baixar código revisável
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolver metadados e validar versões
        id: metadata
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          $ErrorActionPreference = 'Stop'

          $manifest = Get-Content 'version.json' -Raw | ConvertFrom-Json
          $version = [string]$manifest.build
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "version.json contém versão inválida: '$version'."
          }

          if ($env:EVENT_NAME -eq 'workflow_dispatch' -and
              -not [string]::IsNullOrWhiteSpace($env:REQUESTED_VERSION) -and
              $env:REQUESTED_VERSION -ne $version) {
            throw "A versão solicitada ($($env:REQUESTED_VERSION)) não coincide com version.json ($version)."
          }

          $appJs = Get-Content 'app.js' -Raw
          $appVersionMatch = [regex]::Match($appJs, 'const\s+APP_VERSION\s*=\s*[''"](?<v>[^''"]+)[''"]')
          $appBuildMatch = [regex]::Match($appJs, 'const\s+APP_BUILD\s*=\s*[''"](?<v>[^''"]+)[''"]')
          if (-not $appVersionMatch.Success -or $appVersionMatch.Groups['v'].Value -ne $version) {
            throw "APP_VERSION em app.js não coincide com version.json ($version)."
          }
          if (-not $appBuildMatch.Success -or $appBuildMatch.Groups['v'].Value -ne $version) {
            throw "APP_BUILD em app.js não coincide com version.json ($version)."
          }

          $index = Get-Content 'index.html' -Raw
          $escapedVersion = [regex]::Escape($version)
          if ($index -notmatch ('<title>[^<]*v' + $escapedVersion + '</title>')) {
            throw "O título de index.html não identifica a versão v$version."
          }
          if ($index -notmatch ('id="environment-footer-version">v' + $escapedVersion + '</span>')) {
            throw "O rodapé de index.html não identifica a versão v$version."
          }

          $sdkManifest = Get-Content 'global.json' -Raw | ConvertFrom-Json
          $sdkVersion = [string]$sdkManifest.sdk.version
          if ($sdkVersion -notmatch '^8\.0\.\d+$') {
            throw "global.json contém SDK .NET inesperado: '$sdkVersion'."
          }
          if ([string]$sdkManifest.sdk.rollForward -ne 'disable') {
            throw 'global.json deve manter rollForward=disable para build reprodutível.'
          }

          $projectXml = [xml](Get-Content 'windows/CentralManutencao.Win/CentralManutencao.Win.csproj' -Raw)
          $webViewPackage = @($projectXml.Project.ItemGroup.PackageReference) |
            Where-Object { $_.Include -eq 'Microsoft.Web.WebView2' }
          if ($webViewPackage.Count -ne 1) {
            throw 'O projeto deve conter exatamente uma referência Microsoft.Web.WebView2.'
          }
          $webViewVersion = [string]$webViewPackage[0].GetAttribute('Version')
          if ($webViewVersion -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw "Versão do pacote Microsoft.Web.WebView2 não está fixada: '$webViewVersion'."
          }

          $artifactName = "Central-Manutencao-SE-Windows-Native-v$version-run-$($env:RUN_ID)-attempt-$($env:RUN_ATTEMPT)"
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          "DOTNET_SDK_VERSION=$sdkVersion" >> $env:GITHUB_ENV
          "WEBVIEW2_SDK_VERSION=$webViewVersion" >> $env:GITHUB_ENV
          "app_version=$version" >> $env:GITHUB_OUTPUT
          "artifact_name=$artifactName" >> $env:GITHUB_OUTPUT

          Write-Host "Aplicativo: $version"
          Write-Host ".NET SDK: $sdkVersion"
          Write-Host "WebView2 SDK: $webViewVersion"

      - name: Preparar .NET pelo global.json
        id: setup_dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: 'global.json'

      - name: Verificar SDK fixado
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $actual = (dotnet --version).Trim()
          if ($actual -ne $env:DOTNET_SDK_VERSION) {
            throw "SDK .NET inesperado. Esperado $env:DOTNET_SDK_VERSION; obtido $actual."
          }

      - name: Instalar Inno Setup 6.7.3 oficial
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $innoVersion = '6.7.3'
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-$innoVersion.exe"
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe'

          Invoke-WebRequest -Uri $url -OutFile $installer
          if (-not (Test-Path $installer -PathType Leaf)) {
            throw 'Instalador do Inno Setup não foi baixado.'
          }

          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid') {
            throw "Assinatura do Inno Setup inválida: $($signature.Status)."
          }
          if ($signature.SignerCertificate.Subject -notmatch 'Pyrsys B\.V\.') {
            throw "Publicador inesperado no Inno Setup: $($signature.SignerCertificate.Subject)."
          }

          $downloadVersion = (Get-Item $installer).VersionInfo.ProductVersion
          if ($downloadVersion -notlike "$innoVersion*") {
            throw "Versão inesperada do Inno Setup baixado: $downloadVersion."
          }

          $innoHash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "INNO_INSTALLER_SHA256=$innoHash" >> $env:GITHUB_ENV

          $process = Start-Process -FilePath $installer `
            -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' `
            -PassThru
          if (-not $process.WaitForExit(120000)) {
            $process.Kill($true)
            throw 'Instalação do Inno Setup excedeu 120 segundos.'
          }
          if ($process.ExitCode -ne 0) {
            throw "Instalação do Inno Setup falhou com código $($process.ExitCode)."
          }

          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc -PathType Leaf)) {
            throw 'ISCC.exe não foi encontrado após a instalação.'
          }
          $compilerVersion = (Get-Item $iscc).VersionInfo.ProductVersion
          if ($compilerVersion -notlike "$innoVersion*") {
            throw "Versão inesperada do ISCC.exe: $compilerVersion."
          }

      - name: Validar fontes e dependências versionadas
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          $required = @(
            'global.json',
            'index.html',
            'app.js',
            'sw.js',
            'manifest.webmanifest',
            'version.json',
            'assets/icons/central-manutencao.ico',
            'vendor/THIRD_PARTY_SHA256SUMS.txt',
            'vendor/supabase-js-2.57.4.min.js',
            'vendor/xlsx-0.20.3.full.min.js',
            'windows/CentralManutencao.Win/CentralManutencao.Win.csproj',
            'windows/CentralManutencao.Win/Program.cs',
            'windows/CentralManutencao.Win/native-windows.js',
            'windows/installer.iss'
          )

          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Arquivo obrigatório não encontrado: $file"
            }
            if ((Get-Item -LiteralPath $file).Length -eq 0) {
              throw "Arquivo obrigatório vazio: $file"
            }

            git ls-files --error-unmatch -- $file *> $null
            if ($LASTEXITCODE -ne 0) {
              throw "Arquivo obrigatório não está versionado no Git: $file"
            }
          }

          $checksums = @{}
          foreach ($line in Get-Content 'vendor/THIRD_PARTY_SHA256SUMS.txt') {
            if ([string]::IsNullOrWhiteSpace($line)) { continue }
            if ($line -notmatch '^\s*(?<hash>[0-9a-fA-F]{64})\s+\*?(?<name>.+?)\s*$') {
              throw "Linha inválida em vendor/THIRD_PARTY_SHA256SUMS.txt: $line"
            }
            $checksums[$matches['name']] = $matches['hash'].ToLowerInvariant()
          }

          foreach ($name in @('supabase-js-2.57.4.min.js','xlsx-0.20.3.full.min.js')) {
            if (-not $checksums.ContainsKey($name)) {
              throw "Checksum esperado não encontrado para vendor/$name."
            }
            $actual = (Get-FileHash (Join-Path 'vendor' $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $checksums[$name]) {
              throw "Checksum inválido para vendor/$name. Esperado $($checksums[$name]); obtido $actual."
            }
          }

          node --check app.js
          if ($LASTEXITCODE -ne 0) { throw 'app.js contém erro de sintaxe.' }
          node --check windows/CentralManutencao.Win/native-windows.js
          if ($LASTEXITCODE -ne 0) { throw 'native-windows.js contém erro de sintaxe.' }

      - name: Preparar interface embarcada
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item 'windows/stage' -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force 'windows/stage/package/web' | Out-Null
          New-Item -ItemType Directory -Force 'windows/stage/runtime' | Out-Null
          New-Item -ItemType Directory -Force 'windows/stage/out' | Out-Null

          Copy-Item 'index.html' 'windows/stage/package/web/index.html'
          Copy-Item 'app.js' 'windows/stage/package/web/app.js'
          Copy-Item 'manifest.webmanifest' 'windows/stage/package/web/manifest.webmanifest'
          Copy-Item 'version.json' 'windows/stage/package/web/version.json'
          if (Test-Path 'THIRD_PARTY_NOTICES.md') {
            Copy-Item 'THIRD_PARTY_NOTICES.md' 'windows/stage/package/web/THIRD_PARTY_NOTICES.md'
          }
          Copy-Item 'assets' 'windows/stage/package/web/assets' -Recurse
          Copy-Item 'vendor' 'windows/stage/package/web/vendor' -Recurse
          Copy-Item 'windows/CentralManutencao.Win/native-windows.js' 'windows/stage/package/web/native-windows.js'

          @'
          self.addEventListener('install', () => self.skipWaiting());
          self.addEventListener('activate', event => event.waitUntil(self.clients.claim()));
          '@ | Set-Content -Encoding utf8 'windows/stage/package/web/sw.js'

          $indexPath = 'windows/stage/package/web/index.html'
          $html = [System.IO.File]::ReadAllText($indexPath)
          if ($html -notmatch '<script src="\./native-windows\.js"></script>') {
            if ($html -notmatch '</body>') {
              throw 'index.html não contém </body>; injeção nativa abortada.'
            }
            $html = $html.Replace('</body>', "<script src=`"./native-windows.js`"></script>`r`n</body>")
            [System.IO.File]::WriteAllText($indexPath, $html, [System.Text.UTF8Encoding]::new($false))
          }

          $nativeScriptCount = [regex]::Matches($html, 'native-windows\.js').Count
          if ($nativeScriptCount -ne 1) {
            throw "native-windows.js deve aparecer exatamente uma vez no index empacotado; encontrado $nativeScriptCount."
          }
          if ($html -match 'cdn\.jsdelivr\.net|cdn\.sheetjs\.com') {
            throw 'Dependência CDN encontrada no frontend nativo.'
          }

      - name: Compilar aplicativo Windows nativo
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $project = 'windows/CentralManutencao.Win/CentralManutencao.Win.csproj'

          dotnet restore $project --runtime win-x64
          dotnet publish $project `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -p:Version=$env:APP_VERSION `
            -p:FileVersion="$env:APP_VERSION.0" `
            -p:AssemblyVersion="$env:APP_VERSION.0" `
            -p:InformationalVersion=$env:APP_VERSION `
            -p:ContinuousIntegrationBuild=true `
            -o 'windows/stage/package'

          $exe = 'windows/stage/package/CentralManutencaoSE.exe'
          if (-not (Test-Path $exe -PathType Leaf)) {
            throw 'CentralManutencaoSE.exe não foi gerado.'
          }
          $loader = Get-ChildItem 'windows/stage/package' -Filter 'WebView2Loader.dll' -Recurse -ErrorAction SilentlyContinue
          if (-not $loader) {
            throw 'WebView2Loader.dll não foi incluído no pacote.'
          }

          $versionInfo = (Get-Item $exe).VersionInfo
          if ($versionInfo.ProductName -notlike '*Central de Manutenção SE*') {
            throw "Identidade do executável inválida: $($versionInfo.ProductName)"
          }
          if ($versionInfo.ProductVersion -notlike "$env:APP_VERSION*") {
            throw "Versão do executável inválida: $($versionInfo.ProductVersion)"
          }

      - name: Preparar WebView2 Runtime oficial
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bootstrapper = 'windows/stage/runtime/MicrosoftEdgeWebview2Setup.exe'
          Invoke-WebRequest `
            -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' `
            -OutFile $bootstrapper

          if (-not (Test-Path $bootstrapper -PathType Leaf)) {
            throw 'Bootstrapper WebView2 não foi baixado.'
          }
          $signature = Get-AuthenticodeSignature $bootstrapper
          if ($signature.Status -ne 'Valid') {
            throw "Assinatura do WebView2 Bootstrapper inválida: $($signature.Status)"
          }
          if ($signature.SignerCertificate.Subject -notmatch 'Microsoft') {
            throw "Publicador inesperado do WebView2 Bootstrapper: $($signature.SignerCertificate.Subject)"
          }

          $hash = (Get-FileHash $bootstrapper -Algorithm SHA256).Hash.ToLowerInvariant()
          "WEBVIEW2_BOOTSTRAPPER_SHA256=$hash" >> $env:GITHUB_ENV

          $process = Start-Process -FilePath $bootstrapper `
            -ArgumentList '/silent','/install' `
            -WindowStyle Hidden `
            -PassThru
          if (-not $process.WaitForExit(180000)) {
            $process.Kill($true)
            throw 'Instalação do WebView2 Runtime excedeu 180 segundos.'
          }
          if ($process.ExitCode -ne 0) {
            throw "Instalação do WebView2 Runtime falhou com código $($process.ExitCode)."
          }

      - name: Executar self-test do aplicativo
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Invoke-SelfTest([string]$ExePath, [string]$Label) {
            $stdout = Join-Path $env:RUNNER_TEMP "$Label-stdout.txt"
            $stderr = Join-Path $env:RUNNER_TEMP "$Label-stderr.txt"
            Remove-Item $stdout, $stderr -Force -ErrorAction SilentlyContinue

            $process = Start-Process -FilePath $ExePath `
              -ArgumentList '--self-test' `
              -RedirectStandardOutput $stdout `
              -RedirectStandardError $stderr `
              -PassThru

            if (-not $process.WaitForExit(60000)) {
              $process.Kill($true)
              throw "Self-test '$Label' excedeu 60 segundos."
            }

            if (Test-Path $stdout) { Get-Content $stdout | Write-Host }
            if (Test-Path $stderr) { Get-Content $stderr | Write-Host }
            if ($process.ExitCode -ne 0) {
              throw "Self-test '$Label' falhou com código $($process.ExitCode)."
            }
          }

          Invoke-SelfTest 'windows/stage/package/CentralManutencaoSE.exe' 'published-app'

      - name: Gerar instalador
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          $versionDefine = "/DMyAppVersion=`"$env:APP_VERSION`""

          & $iscc $versionDefine 'windows/installer.iss'

          $setup = "windows/stage/out/Central_Manutencao_SE_Setup_v$env:APP_VERSION`_Native.exe"
          if (-not (Test-Path $setup -PathType Leaf)) {
            throw "Instalador final não foi gerado no caminho esperado: $setup"
          }
          if ((Get-Item $setup).Length -eq 0) {
            throw 'Instalador final foi gerado vazio.'
          }
          $setupVersion = (Get-Item $setup).VersionInfo.FileVersion
          if ($setupVersion -notlike "$env:APP_VERSION*") {
            throw "Versão do instalador inválida: $setupVersion"
          }

      - name: Testar instalação real de ponta a ponta
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = "windows/stage/out/Central_Manutencao_SE_Setup_v$env:APP_VERSION`_Native.exe"

          $install = Start-Process -FilePath $setup `
            -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' `
            -PassThru
          if (-not $install.WaitForExit(180000)) {
            $install.Kill($true)
            throw 'Instalação de teste excedeu 180 segundos.'
          }
          if ($install.ExitCode -ne 0) {
            throw "Instalador final falhou com código $($install.ExitCode)."
          }

          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\CentralManutencaoSE'
          $installedExe = Join-Path $installDir 'CentralManutencaoSE.exe'
          if (-not (Test-Path $installedExe -PathType Leaf)) {
            throw "Executável instalado não encontrado: $installedExe"
          }

          $stdout = Join-Path $env:RUNNER_TEMP 'installed-selftest-stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'installed-selftest-stderr.txt'
          $test = Start-Process -FilePath $installedExe `
            -ArgumentList '--self-test' `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -PassThru
          if (-not $test.WaitForExit(60000)) {
            $test.Kill($true)
            throw 'Self-test do aplicativo instalado excedeu 60 segundos.'
          }
          if (Test-Path $stdout) { Get-Content $stdout | Write-Host }
          if (Test-Path $stderr) { Get-Content $stderr | Write-Host }
          if ($test.ExitCode -ne 0) {
            throw "Self-test do aplicativo instalado falhou com código $($test.ExitCode)."
          }

          $uninstaller = Join-Path $installDir 'unins000.exe'
          if (-not (Test-Path $uninstaller -PathType Leaf)) {
            throw 'Desinstalador não foi criado pelo instalador.'
          }
          $uninstall = Start-Process -FilePath $uninstaller `
            -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' `
            -PassThru
          if (-not $uninstall.WaitForExit(120000)) {
            $uninstall.Kill($true)
            throw 'Desinstalação de teste excedeu 120 segundos.'
          }
          if ($uninstall.ExitCode -ne 0) {
            throw "Desinstalação de teste falhou com código $($uninstall.ExitCode)."
          }

          Start-Sleep -Seconds 2
          if (Test-Path $installedExe -PathType Leaf) {
            throw 'O executável permaneceu instalado após a desinstalação de teste.'
          }

      - name: Gerar pacote, checksums e manifesto de build
        shell: pwsh
        env:
          SOURCE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = 'dist/windows-native'
          New-Item -ItemType Directory -Force $dist | Out-Null

          $setupName = "Central_Manutencao_SE_Setup_v$env:APP_VERSION`_Native.exe"
          $setupSource = Join-Path 'windows/stage/out' $setupName
          $setupDest = Join-Path $dist $setupName
          Copy-Item $setupSource $setupDest

          $setupHash = (Get-FileHash $setupDest -Algorithm SHA256).Hash.ToLowerInvariant()
          $appHash = (Get-FileHash 'windows/stage/package/CentralManutencaoSE.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$setupHash  $setupName" | Set-Content -Encoding ascii (Join-Path $dist 'SHA256.txt')

          $buildManifest = [ordered]@{
            appVersion = $env:APP_VERSION
            repository = $env:REPOSITORY
            sourceCommit = $env:SOURCE_SHA
            workflowRunId = $env:WORKFLOW_RUN_ID
            workflowRunAttempt = $env:WORKFLOW_RUN_ATTEMPT
            dotnetSdk = $env:DOTNET_SDK_VERSION
            webView2Sdk = $env:WEBVIEW2_SDK_VERSION
            innoSetup = '6.7.3'
            innoSetupInstallerSha256 = $env:INNO_INSTALLER_SHA256
            webView2BootstrapperSha256 = $env:WEBVIEW2_BOOTSTRAPPER_SHA256
            applicationSha256 = $appHash
            installerSha256 = $setupHash
          }
          $buildManifest | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $dist 'BUILD-MANIFEST.json')

          @"
          # Central de Manutenção SE v$env:APP_VERSION - Windows Native

          - Host Windows nativo WinForms + Microsoft WebView2.
          - .NET SDK de build fixado em $env:DOTNET_SDK_VERSION pelo global.json; aplicativo self-contained x64.
          - Fontes do host Windows ficam versionadas normalmente no Git e podem ser revisadas por diff/blame.
          - Dependências JavaScript locais são validadas por SHA-256 antes do build.
          - Exportações usam a janela nativa Salvar como do Windows.
          - Ao fechar a janela, a Central permanece na área de notificação; use Sair para encerrar.
          - WebView2 Runtime Evergreen oficial da Microsoft é verificado por assinatura Authenticode.
          - O instalador passa por instalação silenciosa real, self-test do executável instalado e desinstalação antes da publicação.
          - Este instalador ainda não possui assinatura Authenticode própria; o Windows SmartScreen pode exibir aviso.

          Commit de origem: $env:SOURCE_SHA
          SHA-256 do bootstrapper WebView2 usado no build: $env:WEBVIEW2_BOOTSTRAPPER_SHA256
          "@ | Set-Content -Encoding utf8 (Join-Path $dist 'LEIA-ME.txt')

          $zip = "dist/Central_Manutencao_SE_Windows_Native_v$env:APP_VERSION.zip"
          Compress-Archive -Path "$dist/*" -DestinationPath $zip -Force
          if (-not (Test-Path $zip -PathType Leaf)) {
            throw 'Pacote ZIP final não foi gerado.'
          }

      - name: Guardar artefato validado
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: dist/**
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publicar release imutável
    if: github.event_name == 'workflow_dispatch'
    needs: build-windows-native
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Baixar artefato validado
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-windows-native.outputs.artifact_name }}
          path: release

      - name: Validar artefato e publicar release sem sobrescrita
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.build-windows-native.outputs.app_version }}
        run: |
          set -euo pipefail

          tag="windows-native-v${APP_VERSION}"
          setup="release/windows-native/Central_Manutencao_SE_Setup_v${APP_VERSION}_Native.exe"
          checksum="release/windows-native/SHA256.txt"
          manifest="release/windows-native/BUILD-MANIFEST.json"
          readme="release/windows-native/LEIA-ME.txt"
          zip="release/Central_Manutencao_SE_Windows_Native_v${APP_VERSION}.zip"

          for asset in "$setup" "$checksum" "$manifest" "$readme" "$zip"; do
            if [[ ! -f "$asset" ]]; then
              echo "Asset ausente: $asset" >&2
              exit 1
            fi
          done

          (cd release/windows-native && sha256sum -c SHA256.txt)

          manifest_sha="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8-sig"))["sourceCommit"])' "$manifest")"
          if [[ "$manifest_sha" != "$GITHUB_SHA" ]]; then
            echo "BUILD-MANIFEST.json pertence ao commit $manifest_sha, não ao commit $GITHUB_SHA." >&2
            exit 1
          fi

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A release $tag já existe. Releases publicadas não são sobrescritas; incremente version.json." >&2
            exit 1
          fi

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "A tag $tag já existe. O workflow não reutiliza tags de release." >&2
            exit 1
          fi

          gh release create "$tag" \
            "$setup" "$checksum" "$manifest" "$readme" "$zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Central de Manutenção SE v${APP_VERSION} - Windows Native" \
            --notes-file "$readme"

          gh release view "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,url,targetCommitish

