      - name: Validar fontes e base web
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            'index.html',
            'app.js',
            'sw.js',
            'manifest.webmanifest',
            'version.json',
            'assets/icons/central-manutencao.ico',
            'vendor/supabase-js-2.57.4.min.js',
            'vendor/xlsx-0.20.3.full.min.js',
            'windows/CentralManutencao.Win/CentralManutencao.Win.csproj',
            'windows/CentralManutencao.Win/Program.cs',
            'windows/CentralManutencao.Win/native-windows.js',
            'windows/installer.iss'
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Arquivo obrigatório não encontrado: $file" }
            if ((Get-Item $file).Length -eq 0) { throw "Arquivo obrigatório vazio: $file" }
          }
          if ((Get-Item 'vendor/supabase-js-2.57.4.min.js').Length -lt 100000) { throw 'Supabase JS local parece incompleto.' }
          if ((Get-Item 'vendor/xlsx-0.20.3.full.min.js').Length -lt 900000) { throw 'SheetJS local parece incompleto.' }
          if (Select-String -Path 'windows/CentralManutencao.Win/Program.cs' -Pattern '127\.0\.0\.1|msedge\.exe|--app=' -Quiet) {
            throw 'Arquitetura antiga baseada em localhost/Edge detectada. Build abortado.'
          }
          node --check app.js
          if ($LASTEXITCODE -ne 0) { throw 'app.js contém erro de sintaxe.' }
          node --check windows/CentralManutencao.Win/native-windows.js
          if ($LASTEXITCODE -ne 0) { throw 'native-windows.js contém erro de sintaxe.' }

      - name: Preparar interface embarcada
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item 'windows/stage' -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force 'windows/stage/package/web' | Out-Null
          New-Item -ItemType Directory -Force 'windows/stage/runtime' | Out-Null
          New-Item -ItemType Directory -Force 'windows/stage/out' | Out-Null

          Copy-Item 'index.html' 'windows/stage/package/web/index.html'
          Copy-Item 'app.js' 'windows/stage/package/web/app.js'
          Copy-Item 'manifest.webmanifest' 'windows/stage/package/web/manifest.webmanifest'
          Copy-Item 'version.json' 'windows/stage/package/web/version.json'
          if (Test-Path 'THIRD_PARTY_NOTICES.md') { Copy-Item 'THIRD_PARTY_NOTICES.md' 'windows/stage/package/web/THIRD_PARTY_NOTICES.md' }
          Copy-Item 'assets' 'windows/stage/package/web/assets' -Recurse
          Copy-Item 'vendor' 'windows/stage/package/web/vendor' -Recurse
          Copy-Item 'windows/CentralManutencao.Win/native-windows.js' 'windows/stage/package/web/native-windows.js'

          # No aplicativo nativo não usamos cache PWA. Isso evita uma versão antiga
          # do frontend permanecer em cache depois de uma atualização do instalador.
          @'
          self.addEventListener('install', event => { self.skipWaiting(); });
          self.addEventListener('activate', event => { event.waitUntil(self.clients.claim()); });
          '@ | Set-Content -Encoding utf8 'windows/stage/package/web/sw.js'

          $indexPath = 'windows/stage/package/web/index.html'
          $html = [System.IO.File]::ReadAllText($indexPath)
          if ($html -notmatch '<script src="\./native-windows\.js"></script>') {
            if ($html -notmatch '</body>') { throw 'index.html não contém </body>; injeção nativa abortada.' }
            $html = $html.Replace('</body>', "<script src=`"./native-windows.js`"></script>`r`n</body>")
            [System.IO.File]::WriteAllText($indexPath, $html, [System.Text.UTF8Encoding]::new($false))
          }
          if ((Select-String -Path $indexPath -Pattern 'native-windows.js').Count -ne 1) { throw 'native-windows.js deve aparecer exatamente uma vez no index empacotado.' }
          if (Select-String -Path $indexPath -Pattern 'cdn\.jsdelivr\.net|cdn\.sheetjs\.com' -Quiet) { throw 'Dependência CDN encontrada no frontend nativo.' }

      - name: Compilar aplicativo Windows nativo
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore 'windows/CentralManutencao.Win/CentralManutencao.Win.csproj'
          if ($LASTEXITCODE -ne 0) { throw 'Falha no dotnet restore.' }
          dotnet publish `
            'windows/CentralManutencao.Win/CentralManutencao.Win.csproj' `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -o 'windows/stage/package'
          if ($LASTEXITCODE -ne 0) { throw 'Falha no dotnet publish.' }

          $exe = 'windows/stage/package/CentralManutencaoSE.exe'
          if (-not (Test-Path $exe)) { throw 'CentralManutencaoSE.exe não foi gerado.' }
          $loader = Get-ChildItem 'windows/stage/package' -Filter 'WebView2Loader.dll' -Recurse -ErrorAction SilentlyContinue
          if (-not $loader) { throw 'WebView2Loader.dll não foi incluído no pacote.' }
          $versionInfo = (Get-Item $exe).VersionInfo
          if ($versionInfo.ProductName -notlike '*Central de Manutenção SE*') { throw "Identidade do executável inválida: $($versionInfo.ProductName)" }

      - name: Preparar Runtime WebView2 oficial
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $bootstrapper = 'windows/stage/runtime/MicrosoftEdgeWebview2Setup.exe'
          Invoke-WebRequest `
            -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' `
            -OutFile $bootstrapper `
            -UseBasicParsing
          if (-not (Test-Path $bootstrapper) -or (Get-Item $bootstrapper).Length -lt 1000000) { throw 'Bootstrapper WebView2 não foi baixado corretamente.' }
          $signature = Get-AuthenticodeSignature $bootstrapper
          if ($signature.Status -ne 'Valid') { throw "Assinatura do WebView2 Bootstrapper inválida: $($signature.Status)" }
          if ($signature.SignerCertificate.Subject -notmatch 'Microsoft') { throw 'O WebView2 Bootstrapper não está assinado pela Microsoft.' }
          Start-Process -FilePath $bootstrapper -ArgumentList '/silent','/install' -Wait -WindowStyle Hidden

      - name: Testar executável antes do instalador
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'windows/stage/package/CentralManutencaoSE.exe'
          & $exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "Self-test do aplicativo falhou com código $LASTEXITCODE." }

      - name: Gerar instalador
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'Compilador do Inno Setup não encontrado.' }
          & $iscc 'windows/installer.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao gerar o instalador.' }
          $setup = 'windows/stage/out/Central_Manutencao_SE_Setup_v1.9.0_Native.exe'
          if (-not (Test-Path $setup)) { throw 'Instalador final não foi gerado.' }
          if ((Get-Item $setup).Length -lt 10000000) { throw 'Instalador final parece incompleto.' }

      - name: Gerar pacote e checksum
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force 'dist/windows-native' | Out-Null
          $setupSource = 'windows/stage/out/Central_Manutencao_SE_Setup_v1.9.0_Native.exe'
          $setupDest = 'dist/windows-native/Central_Manutencao_SE_Setup_v1.9.0_Native.exe'
          Copy-Item $setupSource $setupDest
          $hash = (Get-FileHash $setupDest -Algorithm SHA256).Hash.ToLower()
          "$hash  Central_Manutencao_SE_Setup_v1.9.0_Native.exe" | Set-Content -Encoding ascii 'dist/windows-native/SHA256_WINDOWS_NATIVE_V1.9.0.txt'
          @'
          # Central de Manutenção SE v1.9.0 - Windows Native

          - Host Windows nativo WinForms + Microsoft WebView2.
          - Não abre Microsoft Edge e não usa localhost/127.0.0.1.
          - .NET 8 self-contained x64.
          - Frontend v1.9.0 READY e bibliotecas JavaScript incorporados.
          - Mesmo ícone do PWA.
          - Exportações usam a janela nativa Salvar como do Windows.
          - Ao fechar a janela, a Central permanece na área de notificação; use Sair no ícone para encerrar.
          - Notificações no EXE são entregues pela integração nativa enquanto a Central estiver em execução.
          - WebView2 Runtime Evergreen oficial da Microsoft é instalado somente se necessário.
          - Este instalador ainda não possui assinatura Authenticode comercial.
          '@ | Set-Content -Encoding utf8 'dist/windows-native/LEIA-ME.txt'
          Compress-Archive -Path 'dist/windows-native/*' -DestinationPath 'dist/Central_Manutencao_SE_Windows_Native_v1.9.0.zip' -Force

      - name: Guardar artefato validado
        uses: actions/upload-artifact@v4
        with:
          name: Central-Manutencao-SE-Windows-Native-v1.9.0
          path: |
            dist/windows-native/Central_Manutencao_SE_Setup_v1.9.0_Native.exe
            dist/windows-native/SHA256_WINDOWS_NATIVE_V1.9.0.txt
            dist/windows-native/LEIA-ME.txt
            dist/Central_Manutencao_SE_Windows_Native_v1.9.0.zip
          if-no-files-found: error

      - name: Publicar Release Windows Native
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $repo = '${{ github.repository }}'
          $tag = 'windows-native-v1.9.0'
          $assets = @(
            'dist/windows-native/Central_Manutencao_SE_Setup_v1.9.0_Native.exe',
            'dist/windows-native/SHA256_WINDOWS_NATIVE_V1.9.0.txt',
            'dist/windows-native/LEIA-ME.txt',
            'dist/Central_Manutencao_SE_Windows_Native_v1.9.0.zip'
          )
          foreach ($asset in $assets) { if (-not (Test-Path $asset)) { throw "Asset ausente: $asset" } }

          gh release view $tag --repo $repo *> $null
          $exists = ($LASTEXITCODE -eq 0)

          if ($exists) {
            gh release upload $tag @assets --repo $repo --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Falha ao atualizar assets da Release.' }
          } else {
            gh release create $tag @assets `
              --repo $repo `
              --target '${{ github.sha }}' `
              --title 'Central de Manutenção SE v1.9.0 - Windows Native' `
              --notes 'Build Windows nativo validado automaticamente antes da publicação. Sem localhost e sem janela do navegador.'
            if ($LASTEXITCODE -ne 0) { throw 'Falha ao criar a Release Windows Native.' }
          }

          gh release view $tag --repo $repo --json tagName,name,url
          if ($LASTEXITCODE -ne 0) { throw 'A Release não pôde ser validada após a publicação.' }
